<script id="elenya-fullscreen-optin">
/* Plein écran optionnel. Jamais forcé : ceux qui restent dans la page ne changent rien. */
(function () {
  if (window.toggleGameFullscreen) return;
  var KEY = 'ef_fullscreen_v524';
  function btn() { return document.getElementById('btn-fullscreen'); }
  function active() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function paint() {
    var b = btn();
    if (!b) return;
    var on = active();
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.title = on ? 'Quitter le plein écran' : 'Plein écran (optionnel)';
    b.setAttribute('aria-label', b.title);
    document.body.classList.toggle('elenya-fullscreen', on);
  }
  window.toggleGameFullscreen = function () {
    var root = document.documentElement;
    if (active()) {
      var exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      try { localStorage.setItem(KEY, '0'); } catch (e) {}
      return;
    }
    var req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (!req) {
      var live = document.getElementById('rf-live');
      if (live) live.textContent = 'Plein écran indisponible ici. Le jeu reste dans la page.';
      return;
    }
    var done = req.call(root);
    if (done && typeof done.then === 'function') {
      done.then(function () {
        try { localStorage.setItem(KEY, '1'); } catch (e) {}
        paint();
      }).catch(function () {
        try { localStorage.setItem(KEY, '0'); } catch (e) {}
      });
    } else {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    }
  };
  document.addEventListener('fullscreenchange', paint);
  document.addEventListener('webkitfullscreenchange', paint);
  document.addEventListener('DOMContentLoaded', paint);
})();
</script>
