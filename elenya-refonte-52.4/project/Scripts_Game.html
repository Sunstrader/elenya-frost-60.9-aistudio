const ImageCache = {

failedUrls: new Set(),
preloadImage(url) {
if (!url || url === 'none' || this.failedUrls.has(url) || this.cache[url]) return;
const img = new Image();
img.onerror = () => {
  this.failedUrls.add(url);
  if (_currentBg === url) {
    document.body.style.setProperty('--bg-before', "url('" + CONFIG.FALLBACK_BG + "')");
    document.body.style.setProperty('--bg-after', 'none');
  }
};
img.onload = () => this.cache[url] = true;
img.src = url;
},
getSafeUrl(url) {
if (!url || url === 'none') return 'none';
return this.failedUrls.has(url) ? CONFIG.FALLBACK_BG : url;
}
};

function setBackground(url) {
const body = document.body;
if (!url || url === "none" || url === "") {
_currentBg = null;
body.style.setProperty('--bg-before', 'none');
body.style.setProperty('--bg-after', 'none');
body.classList.remove('fading');
return;
}
const safeUrl = ImageCache.getSafeUrl(url);
const cssUrl = "url('" + safeUrl + "')";
if (!_currentBg) {
_currentBg = url;
body.style.setProperty('--bg-before', cssUrl);
body.style.setProperty('--bg-after', 'none');
return;
}
_currentBg = url;
body.style.setProperty('--bg-after', cssUrl);
body.classList.add('fading');
setTimeout(() => {
body.style.setProperty('--bg-before', cssUrl);
body.classList.remove('fading');
body.style.setProperty('--bg-after', 'none');
}, 520);
}
function sceneBackgroundForViewport(data) {
return data && data.imageMobile && window.matchMedia('(max-width: 760px) and (orientation: portrait)').matches

function updateSprite(id, url) {

if (!url || url === "none" || url === "") {
layer.dataset.current = "";
layer.style.setProperty('--sprite-before', 'none');
layer.style.setProperty('--sprite-after', 'none');
layer.classList.remove('fading');
return;
}
if (layer.dataset.current === url) return;
const safeUrl = ImageCache.getSafeUrl(url);

layer.dataset.current = url;
layer.style.setProperty('--sprite-before', cssUrl);
layer.style.setProperty('--sprite-after', 'none');
return;
}
layer.dataset.current = url;
layer.style.setProperty('--sprite-after', cssUrl);
layer.classList.add('fading');

layer.classList.remove('fading');
layer.style.setProperty('--sprite-after', 'none');
}, 340);
}

// Volume de la musique : base de la piste × facteur des réglages (aucune baisse liée à une voix : la narration vocale est retirée depuis la 55).
function setBgmVolume(el, base) {
  el._baseVolume = Math.min(1, Math.max(0, base));
  const factor = typeof RF !== 'undefined' ? RF.audioFactor : 1;
  el.volume = _isMuted ? 0 : el._baseVolume * factor;
}
function playAudioForScene(mood) {
const moodKey = mood === 'intimate' ? 'romance' : ((mood === 'end' || mood === 'gameover') ? 'epilogue' : mood);
const bgm = document.getElementById('bgm');
bgm.loop = false;
if (!bgm._rotationBound) {
  bgm._rotationBound = true;
  bgm.addEventListener('ended', () => { const previous = _currentAudioMood; _currentAudioMood = null; _currentAudioUrl = null; if (document.getElementById('accueil-screen').classList.contains('hidden')) playAudioForScene(previous); });
  bgm.addEventListener('playing', () => { if (typeof RF !== 'undefined') RF.noteTrack(bgm.currentSrc || bgm.src); });
}
if (_currentAudioMood === moodKey && _currentAudioUrl) {
  if (!_isMuted && bgm.paused && !bgm._fadeInterval) { setBgmVolume(bgm, CONFIG.BGM_VOLUME); bgm.play().catch(() => {}); }
  return;
}
const tracks = CONFIG.AUDIO_MAP[moodKey] || CONFIG.AUDIO_MAP['exploration'];
const choices = Array.isArray(tracks) ? tracks : [tracks];
const nextIndex = ((_audioRotation[moodKey] ?? -1) + 1) % choices.length;
_audioRotation[moodKey] = nextIndex;
const url = choices[nextIndex];
_currentAudioMood = moodKey;
if (url === _currentAudioUrl) return;
_currentAudioUrl = url;
fadeAudio(bgm, bgm.volume, 0, 400, () => {
bgm.pause();
bgm.src = url;
setBgmVolume(bgm, 0);
if (!_isMuted) bgm.play().then(() => fadeAudio(bgm, 0, CONFIG.BGM_VOLUME, 800, null)).catch(() => {});
});
}

function fadeAudio(el, from, to, durationMs, callback) {
if (el._fadeInterval) clearInterval(el._fadeInterval);
if (el.id === 'bgm') from = el._baseVolume ?? from;
const steps = 20, interval = durationMs / steps, delta = (to - from) / steps;
let step = 0;
el._fadeInterval = setInterval(() => {
step++;
const level = Math.min(1, Math.max(0, from + delta * step));
if (el.id === 'bgm') setBgmVolume(el, level); else el.volume = level;
if (step >= steps) {
clearInterval(el._fadeInterval);
el._fadeInterval = null;
if (callback) callback();
}
}, interval);
}

(function initParticles() {
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
const canvas = document.getElementById('particles-canvas'), ctx = canvas.getContext('2d');
let parts = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize, { passive: true });
resize();
for (let i = 0; i < 18; i++) {
parts.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
r: Math.random() * 1.3 + 0.4,
vx: (Math.random() - 0.5) * 0.22,
vy: -Math.random() * 0.32 - 0.08
});
}
function loop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = 'rgba(180,210,255,0.42)';
parts.forEach(p => {
p.x += p.vx; p.y += p.vy;
if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fill();
});
requestAnimationFrame(loop);
}
loop();
})();

(function initFrostTrail() {
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
const canvas = document.getElementById('frost-trail-canvas'), ctx = canvas.getContext('2d');
let particles = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize, { passive: true });
resize();
const handleTrail = (x, y) => {
if (document.body.classList.contains('video-playing')) return;
particles.push({ x, y, r: Math.random() * 2 + 1, life: 1 });
if (particles.length > 30) particles.shift();
};
window.addEventListener('mousemove', e => handleTrail(e.clientX, e.clientY), { passive: true });
window.addEventListener('touchmove', e => {
if (e.touches && e.touches.length > 0) handleTrail(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
function loop() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let i = particles.length - 1; i >= 0; i--) {
let p = particles[i];
p.life -= 0.032;
if (p.life <= 0) { particles.splice(i, 1); continue; }
ctx.beginPath();
ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
ctx.fillStyle = `rgba(180,220,255,${0.35 * p.life})`;
ctx.fill();
}
requestAnimationFrame(loop);
}
loop();
})();

function setProgress(sceneId, total) {

// 60.8.1 (playtest #3) : *italique* du texte serveur rendu en <em>, sans innerHTML (pas d'injection possible).
function elenyaFillEm_(el, txt) {
el.textContent = '';
String(txt).split(/(\*{1,2}[^*\n]+\*{1,2})/).forEach(part => {
if (!part) return;
const m = /^\*{1,2}([^*\n]+)\*{1,2}$/.exec(part);
if (m) { const em = document.createElement('em'); em.textContent = m[1]; el.appendChild(em); }
else el.appendChild(document.createTextNode(part));
});
}
function elenyaSansEm_(txt) { return String(txt).replace(/\*{1,2}([^*\n]+)\*{1,2}/g, '$1'); }

function renderNarrativeAsHTML(text) {
const el = document.getElementById('narrative');
el.innerHTML = '';
text.split('\n').filter(p => p.trim().length > 0).forEach(para => {
const p = document.createElement('p');
elenyaFillEm_(p, para.trim());
el.appendChild(p);
});
}

function typeWriter(text) {
const el = document.getElementById('narrative');
if (typingRafId) cancelAnimationFrame(typingRafId);
text = normalizeNewlines(text);
el.innerHTML = '';
currentFullText = text;
isTyping = true;
_pauseUntil = 0;
const parasEm = text.split('\n').filter(p => p.trim().length > 0);
const paras = parasEm.map(elenyaSansEm_);
const paraElements = paras.map(() => {
const p = document.createElement('p');
el.appendChild(p);
return p;
});
let paraIdx = 0, charIdx = 0, lastTs = null, carried = 0;
function step(ts) {
if (!isTyping) return;
if (ts < _pauseUntil) { typingRafId = requestAnimationFrame(step); return; }
if (lastTs === null) lastTs = ts;
const delta = (ts - lastTs) + carried;
lastTs = ts;
const toWrite = Math.floor(delta / MS_PER_CHAR);
carried = delta % MS_PER_CHAR;
if (toWrite > 0) {
const currentPara = paras[paraIdx];
const chunk = currentPara.slice(charIdx, charIdx + toWrite);
paraElements[paraIdx].textContent += chunk;
charIdx += toWrite;
const lastChar = chunk.charAt(chunk.length - 1);
if (PUNCT_PAUSE[lastChar] && !(paraIdx === paras.length - 1 && charIdx === currentPara.length)) {
_pauseUntil = ts + PUNCT_PAUSE[lastChar];
carried = 0;
}
if (charIdx >= currentPara.length) { paraIdx++; charIdx = 0; }
}
if (paraIdx < paras.length) {
typingRafId = requestAnimationFrame(step);
} else {
isTyping = false;
typingRafId = null;
paraElements.forEach((pe, i) => elenyaFillEm_(pe, parasEm[i]));
focusFirstChoice();
}
}
typingRafId = requestAnimationFrame(step);
}

currentFullText = text;

function usePortraitMobileEndingVideo() {
return !!(window.matchMedia && window.matchMedia('(max-width: 760px) and (orientation: portrait)').matches);
}

function responsiveEndingVideoUrl(url) {
const source = String(url || '');
if (!source || !usePortraitMobileEndingVideo()) return source;
return source.includes('/game-v55/endings/')
  ? source.replace('/game-v55/endings/', '/game-v55/endings-mobile/')
  : source;
}

function setResponsiveVideoSource(video, desktopUrl, autoplay = false, mobileUrl = null, onFailure = null, onFallback = null) {
if (!video || !desktopUrl) return String(desktopUrl || '');
const source = String(desktopUrl);
const preferred = mobileUrl && usePortraitMobileEndingVideo() ? String(mobileUrl) : responsiveEndingVideoUrl(source);
const canFallback = preferred !== source;
video.dataset.desktopSrc = source;
video.dataset.preferredSrc = preferred;
video.removeAttribute('data-mobile-fallback');
video.onerror = canFallback ? () => {
  if (video.dataset.mobileFallback === 'done') return;
  video.dataset.mobileFallback = 'done';
  video.onerror = onFailure;
  video.src = source;
  if (onFallback) onFallback(source);
  if (autoplay) {
    const retry = video.play();
    if (retry && typeof retry.catch === 'function') retry.catch(() => {});
  }
} : onFailure;
video.src = preferred;
if (autoplay) {
  const attempt = video.play();
  if (attempt && typeof attempt.catch === 'function') attempt.catch(() => {});
}
return preferred;
}

let _cinematicPausedBgm = false;
function cinematicCompanionAudioUrl(url) {

  return match ? 'https://cdn.jsdelivr.net/gh/Sunstrader/elenya-3d-assets@cf47f99805c42e1a53b1de55200207f32da8ea59/game-v58/cinematics/' + match[1] + '.m4a' : '';

function playCinematicWithSound() {

  video.pause();
  video.currentTime = 0;
  video.muted = _isMuted || !!(audio && audio.getAttribute('src'));
  video.volume = 1;
  const attempts = [video.play()];
  if (audio && audio.getAttribute('src')) {
    audio.pause();
    audio.currentTime = 0;
    audio.muted = _isMuted;
    audio.volume = video.volume;
    attempts.push(audio.play());
  }
  Promise.all(attempts).then(() => {

  }).catch(() => {
    video.pause();
    if (audio) audio.pause();

  });
}

const ELENYA_LAST_SAVE_KEY='elenya_last_save_at';

function fnv1a32(text){
  let hash=0x811c9dc5;
  const s=String(text||'');
  for(let i=0;i<s.length;i++){
    hash^=s.charCodeAt(i);
    hash=Math.imul(hash,0x01000193);
  }
  return ('00000000'+(hash>>>0).toString(16)).slice(-8);
}
function backupIntegritySource(payload){
  return JSON.stringify({
    backupVersion:payload.backupVersion,
    buildVersion:payload.buildVersion||null,
    exportedAt:payload.exportedAt||null,
    state:payload.state,
    achievements:payload.achievements||[],
    gallery:payload.gallery||[],
    visitedScenes:payload.visitedScenes||[],
    coverage:payload.coverage||null
  });
}
function markLocalSave(timestamp){
  const t=Number(timestamp)||Date.now();
  try{localStorage.setItem(ELENYA_LAST_SAVE_KEY,String(t));}catch(_){}
  refreshSaveAge();
}
function formatSaveAge(timestamp){
  const t=Number(timestamp)||0;
  if(!t)return 'AUCUNE SAUVEGARDE';
  const sec=Math.max(0,Math.floor((Date.now()-t)/1000));
  if(sec<5)return 'SAUVEGARDÉ · à l’instant';
  if(sec<60)return 'SAUVEGARDÉ · il y a '+sec+' s';
  const min=Math.floor(sec/60);
  if(min<60)return 'SAUVEGARDÉ · il y a '+min+' min';
  const hours=Math.floor(min/60);
  if(hours<24)return 'SAUVEGARDÉ · il y a '+hours+' h';
  const days=Math.floor(hours/24);
  return 'SAUVEGARDÉ · il y a '+days+' j';
}
function refreshSaveAge(){
  const el=document.getElementById('save-status');
  if(!el)return;
  let t=0;
  try{t=Number(localStorage.getItem(ELENYA_LAST_SAVE_KEY)||0);}catch(_){}
  if(!window._serverAutoSaveBusy && el.textContent!=='SAUVEGARDE…') el.textContent=formatSaveAge(t);
}
function validateImportedStateBasic(state,payload){
  if(!state || typeof state!=='object' || Array.isArray(state))throw new Error('État absent ou invalide.');
  if(typeof state.currentSceneId!=='string' || !state.currentSceneId.trim())throw new Error('Scène de reprise manquante.');
  if(state.flags && !Array.isArray(state.flags))throw new Error('Flags invalides.');
  if(state.achievements && !Array.isArray(state.achievements))throw new Error('Succès invalides.');
  if(!state.gameMode)state.gameMode='classic';
  if(!['classic','ngplus'].includes(state.gameMode))throw new Error('Mode invalide.');
  if(payload&&payload.buildVersion!=null&&typeof payload.buildVersion!=='string')throw new Error('Version de sauvegarde invalide.');
}
function verifyBackupIntegrity(payload){
  if(!payload || !payload.integrity)return {verified:false,legacy:true};
  if(payload.integrity.algorithm!=='fnv1a32')throw new Error('Algorithme d’intégrité inconnu.');
  const expected=fnv1a32(backupIntegritySource(payload));
  if(String(payload.integrity.checksum||'').toLowerCase()!==expected)throw new Error('Checksum incorrect : fichier modifié ou tronqué.');
  return {verified:true,legacy:false};
}

// ===== V51 — PROFIL JOUEUR / LECTURE NARRATIVE DES JAUGES =====
function derivePlayerProfile(state) {
  const g = (state && state.gauges) || {};
  const n = (state && state.narrative) || {};
  const seeds = n.endingSeeds || {};
  const possession = Number(g.possession || 0);
  const volonte = Number(g.volonte || 0);
  const memoire = Number(g.memoire_kalthar || 0);
  const instabilite = Number(g.instabilite || 0);

  if (possession >= 20) return { title: 'Couronne possessive', desc: 'Elenya tend à confondre protection, désir et emprise.' };
  if (instabilite >= 30) return { title: 'Givre instable', desc: 'Le pouvoir répond plus vite que la raison.' };
  if (memoire >= 15 && volonte >= 8) return { title: 'Mémoire éveillée', desc: 'Elenya comprend de mieux en mieux ce qui lui a été retiré.' };
  if (volonte >= 10 && possession <= 10) return { title: 'Souveraine libre', desc: 'Elle choisit sans accepter que le choix devienne une cage.' };

  const dominant = Object.entries(seeds).sort((a,b)=>Number(b[1]||0)-Number(a[1]||0))[0];
  if (dominant && Number(dominant[1]||0) > 0) {
    const labels = { shadow:'Ombre', light:'Lumière', poly:'Deux liens', freedom:'Liberté', possession:'Possession', truth:'Vérité', sacrifice:'Sacrifice', reconciliation:'Réconciliation', corona:'Corona' };
    return { title: labels[dominant[0]] || 'En devenir', desc: 'La trajectoire actuelle penche vers : ' + (labels[dominant[0]] || dominant[0]) + '.' };
  }
  // 60.8.1 : pas de « En devenir » sur un écran de fin (y compris les morts).
  if (/^(FIN_|NG_FIN_|ACTE5_02_|GAME_OVER_)/.test(String((state && state.currentSceneId) || ''))) return { title: 'Ton propre chemin', desc: 'Aucune voie ne t’a été dictée.' };
  return { title: 'En devenir', desc: 'Aucune trajectoire ne domine encore vraiment.' };
}

function describeRelationship(state, route) {
  const n = (state && state.narrative && state.narrative.relationshipStyle) || {};
  const style = route === 'O' ? n.O : n.E;
  const names = route === 'O'
    ? {distance:'distant',tension:'tendu',attachement:'attachement réel',confiance:'confiance profonde',possession:'lien possessif'}
    : {distance:'distant',doute:'doute croissant',devotion:'dévotion',confiance:'confiance profonde',cage:'lien qui devient une cage'};
  return names[style] || 'indéterminé';
}

function recentMeaningfulChoices(state) {
  const hist = Array.isArray(state && state.choiceHistory) ? state.choiceHistory : [];
  return hist.slice(-5).reverse();
}

function formatTime(ms) {
const seconds = Math.floor(ms / 1000);
const minutes = Math.floor(seconds / 60);
const hours = Math.floor(minutes / 60);
if (hours > 0) {
return `${hours}h ${minutes % 60}m`;
} else if (minutes > 0) {
return `${minutes}m ${seconds % 60}s`;
} else {
return `${seconds}s`;
}
}

function updateStats(incrementChoice = false) {
  const state = getActiveState() || {};
  if (!state.stats) state.stats = {};
  if (!state.stats.playTime) state.stats.playTime = 0;
  if (!state.stats.choicesMade) state.stats.choicesMade = 0;
  if (state.sessionStartedAt) {
    state.stats.playTime += Math.max(0, Date.now() - Number(state.sessionStartedAt));
    state.sessionStartedAt = Date.now();
  }
  if (incrementChoice) state.stats.choicesMade++;
  const ombre = Number(state.gauges?.lien_O || 0);
  const eclaireur = Number(state.gauges?.lien_E || 0);
  const solo = Number(state.gauges?.instabilite || 0);
  if (ombre > eclaireur && ombre > solo) state.stats.dominantPath = 'Ombre';
  else if (eclaireur > ombre && eclaireur > solo) state.stats.dominantPath = 'Éclaireur';
  else state.stats.dominantPath = 'Soi';
  setActiveState(state);
  updateAAAState(state);
  return state;
}

function toRoman(value){
  let n=Math.max(1,Math.floor(Number(value)||1));
  const table=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out='';
  for(const [num,sym] of table){while(n>=num){out+=sym;n-=num;}}
  return out;
}
function readNarrativeCounter(key){
  const n=Number(localStorage.getItem(key)||0);
  return Number.isFinite(n)&&n>0?Math.floor(n):0;
}
function narrativeRunLabel(mode){
  if(mode==='ngplus'){
    const played=readNarrativeCounter(ELENYA_NGPLUS_CYCLE_KEY);
    const cycle=Math.max(2,played+1);
    const phrase=ELENYA_NGPLUS_OPENERS[(cycle-2)%ELENYA_NGPLUS_OPENERS.length];
    return 'Cycle '+toRoman(cycle)+' — '+phrase;
  }
  const run=Math.max(1,readNarrativeCounter(ELENYA_RUN_LABEL_KEY));

function callServer() {
const epoch = _choiceRequestEpoch;
if (typeof RF !== 'undefined' && epoch !== RF.epoch) return;
// Les tentatives réseau repartent du même état ; le serveur compte le choix une seule fois.
const currentState = _choiceRequestState || getActiveState();
const oldBg = _currentBg;
google.script.run
.withSuccessHandler(result => {
if (typeof RF !== 'undefined' && epoch !== RF.epoch) return;
hideOverlay();
_retryCount = 0;
if (typeof RF !== 'undefined') RF.settle(!!result && !result.error);
if (result && result.error) { alert(result.error); if(result.nextSceneData)renderScene(result.nextSceneData); return; }
if (!result || !result.nextSceneData) {
  if (result && result.updatedState) {
    setActiveState(result.updatedState);
    updateAAAState(result.updatedState);
    if (result.updatedState.achievements) persistAchievements(result.updatedState.achievements);
    checkNewAchievements(result.updatedState);
  }
  returnToMenu();
  return;
}

// L'ancien ordre déclenchait une ReferenceError (TDZ) et bloquait le rendu
// de la scène suivante jusqu'à un retour menu > Reprendre.
const nextData = result.nextSceneData;
if (result.updatedState) {
  setActiveState(result.updatedState);
  updateAAAState(result.updatedState, nextData);
  if (result.choiceUX) ux513ChoiceAftermath(result.choiceUX);
  if (result.updatedState.achievements) persistAchievements(result.updatedState.achievements);
  checkNewAchievements(result.updatedState);

ImageCache.preloadImage(nextDisplayImage);
unlockCG(nextDisplayImage);
document.body.style.setProperty('--bg-before', "url('" + ImageCache.getSafeUrl(nextDisplayImage) + "')");
_currentBg = nextDisplayImage;
}
if (nextData.transitionGif) unlockCG(nextData.transitionGif);
const sid = String(nextData.sceneNumber || '');
const isFb = isFlashbackScene(nextData);
const previousChapter = Number(document.body.dataset.currentChapter || _lastRenderedChapter || 0);
const incomingChapter = Number(nextData.chapter || 1);
const isActChange = previousChapter > 0 && incomingChapter !== previousChapter;
const lightTransition = /^(LIEN_|JOUTE_|R_|ACTE_DAGUE|ACTE3_DAGUE|ACTE3_SILAS|ACTE1_SOLO|ACTE_SOLO|AVEU_)/.test(sid)
&& !isFb;

// Le changement d’acte devient un checkpoint joueur (Actes I à IV).
// L’état courant pointe déjà sur le début de l’acte suivant, ce qui garantit
// qu’un "Sauvegarder et quitter" reprendra exactement à ce point.
if (isActChange && previousChapter >= 1 && previousChapter < 5 && incomingChapter > previousChapter) {
  if (showActCheckpoint(nextData, previousChapter, incomingChapter, isFb)) return;
}

renderScene(nextData);
if (typeof RF !== 'undefined' && nextData.presentation?.effect) RF.effect(nextData.presentation.effect);

if (isFb) {
  playFlashbackEffect(() => {});
} else if (!isActChange && !lightTransition) {
  playIceCrack(oldBg, () => {});
}
})
.withFailureHandler(err => {
if (typeof RF !== 'undefined' && epoch !== RF.epoch) return;
if (_retryCount < 2) {
_retryCount++;
setTimeout(callServer, 1500);
} else {
hideOverlay();
if (typeof RF !== 'undefined') RF.settle(false);
document.querySelectorAll('#choices .choice-btn').forEach(b=>b.disabled=false);
alert('Erreur serveur : ' + err);
}
})
.serverProcessChoice(currentState, _lastChoiceKey);

const UX512 = {
  feedbackTimer: null,
  majorHistoryLimit: 12,
  showFeedback(text) {
    if (!text) return;
    const el = document.getElementById('narrative-feedback');
    if (!el) return;
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(this.feedbackTimer);

    // V51.5.0 — temps de lecture adaptatif.
    // Minimum ~4.8 s ; +35 ms par caractère ; maximum 9 s.
    // Les feedbacks narratifs ne disparaissent plus avant d'avoir pu être lus.
    const readingMs = Math.max(4800, Math.min(9000, 2600 + String(text).length * 35));
    this.feedbackTimer = setTimeout(() => el.classList.remove('visible'), readingMs);
  },
  deriveProfile(state) {
    const g = (state && state.gauges) || {};
    const f = new Set((state && state.flags) || []);

    const fini=/^(FIN_|NG_FIN_|ACTE5_02_|GAME_OVER_)/.test(String((state&&state.currentSceneId)||''));

    if (P>=20 || f.has('domination_path_chosen')) {
      title="La Couronne qui serre"; subtitle="Le pouvoir répond vite. La question est de savoir ce qu’il te laissera encore aimer.";
    } else if (V>=12 && P<=7) {
      title="La Reine sans chaînes"; subtitle="Tu avances sans confondre l’amour, le devoir et la possession.";
    } else if (I>=30) {
      title="La Tempête éveillée"; subtitle="Le givre te reconnaît plus vite que le monde. Rester toi-même devient un choix.";

  },
  addJournal(text, meta) {

  if (journalText) {
    UX512.addJournal(journalText, {
      importance: meta.importance || 'souvenir',
      target: meta.target || ''
    });

function ux513EndingRoute(state){
  const f=new Set(state?.flags||[]);
  let route=String(state?.route||'').toLowerCase();
  if(!['solo','ombre','eclaireur','poly'].includes(route)){
    if(f.has('avec_ombre')&&f.has('avec_eclaireur'))route='poly';
    else if(f.has('avec_ombre'))route='ombre';
    else if(f.has('avec_eclaireur'))route='eclaireur';

}
function ux513KnownDestinies(state){

  });

  });
  if(f.has('lyra_liberee')||f.has('lyra_punie')) rows.push({name:'Lyra',state:f.has('lyra_liberee')?'libérée':'punie'});
  if(f.has('mira_liberee')||f.has('mira_rejetee')||f.has('mira_alliee')) rows.push({name:'Mira',state:f.has('mira_liberee')?'libérée':f.has('mira_alliee')?'alliée':'écartée'});
  if(f.has('seraphine_fin_alliee')||f.has('seraphine_ennemie')) rows.push({name:'Séraphine',state:f.has('seraphine_fin_alliee')?'alliée':(/^FIN_(EQUILIBRE|RECONCILIATION|TEMOIN|DETTE_ANNULEE|REDEMPTION|VERITE)$/.test(String((state&&state.currentSceneId)||''))?'méfiante':'ennemie')}); // 60.8.1 (playtest #5)

function ux513EndingProgress(){
  const endingKeys=Object.keys(ACHIEVEMENTS_REGISTRY).filter(k =>
    /^ach_fin_/.test(k) ||
    /^ach_ng_fin_/.test(k) ||
    ['ach_surcharge','ach_sirene','ach_scellee','ach_venin','ach_possession'].includes(k)
  );
  // 60.3 : deux succès de fin n’ont aucune scène (ach_fin_secrete, ach_fin_ng_trone_deux_places) ;
  // ils ne comptent plus dans le total, qui devient celui des fins réellement atteignables.
  const orphelins=['ach_fin_secrete','ach_fin_ng_trone_deux_places'];
  for(let i=endingKeys.length-1;i>=0;i--) if(orphelins.includes(endingKeys[i])) endingKeys.splice(i,1);
  const unlocked=new Set(getAllAchievements());
  const found=endingKeys.filter(k=>unlocked.has(k)).length;
  return {found,total:endingKeys.length,unknown:Math.max(0,endingKeys.length-found)};
}
function ux513MajorMemories(state){

      '<span>'+progress.unknown+' chemin'+(progress.unknown>1?'s':'')+' reste'+(progress.unknown>1?'nt':'')+' inconnu'+(progress.unknown>1?'s':'')+'.</span></div>';
  container.appendChild(card);

// V51.5.0 — contrôle manuel du feedback.
(function(){
  const bindFeedbackControls = () => {
    const el = document.getElementById('narrative-feedback');
    if (!el || el.dataset.v5141Bound) return;
    el.dataset.v5141Bound = '1';

    // Clic/tap = fermer volontairement.
    el.addEventListener('click', () => {
      clearTimeout(UX512.feedbackTimer);
      el.classList.remove('visible');
    });

    // Sur ordinateur, garder le texte tant que la souris est dessus.
    el.addEventListener('mouseenter', () => clearTimeout(UX512.feedbackTimer));
    el.addEventListener('mouseleave', () => {
      if (!el.classList.contains('visible')) return;
      UX512.feedbackTimer = setTimeout(() => el.classList.remove('visible'), 2500);
    });
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bindFeedbackControls, {once:true});
  } else {
    bindFeedbackControls();
  }

<script>
/* ═══ 53.2.0 — Modules ajoutés dans le code ACTIF (aucune dépendance aux scripts Refonte inactifs) ═══
   - Accessibilité (lot 10) : annonce du texte aux lecteurs d'écran, flèches haut/bas entre les choix.
   - « Précédemment… » (lot 09) : rappel de la dernière scène après une longue pause.
   - Chaînes d'interface fr/en (lot 11) : EF_CONFIG.langueInterface = 'fr' (défaut) ou 'en'.
   Chaque module se coupe dans EF_CONFIG (voir CONFIG_GUIDE.md). */
(function(){
  'use strict';
  const CFG = window.EF_CONFIG || {};
  const on = k => CFG[k] !== false;

  /* ---------- Lot 11 : chaînes d'interface ---------- */
  const EF_STRINGS = {

    en: {

        '🖼️ Galerie': '🖼️ Gallery',
        'Jouer en plein écran ?': 'Play in fullscreen?',
        'Le jeu est pensé pour le plein écran. Tu pourras changer à tout moment avec ⛶ dans le menu.': 'The game is designed for fullscreen. You can switch at any time with ⛶ in the menu.',
        '⛶ Plein écran (recommandé)': '⛶ Fullscreen (recommended)',
        '▣ Rester en fenêtre': '▣ Stay windowed',
        '⛶ Passer en plein écran': '⛶ Go fullscreen',
        'Plus tard': 'Later',
        'Retour au menu': 'Back to menu',
        'MENU': 'MENU',
        'Journal': 'Log', 'Notes': 'Notes', 'Liens': 'Bonds', 'Apparition': 'Fade-in', 'Passages lus': 'Read passages',
        'Texte': 'Text', 'Son': 'Sound', 'Couleurs': 'Colours', 'Écran': 'Screen',
        'Vitesse du texte': 'Text speed',
        '💾 Sauvegarder': '💾 Save',
        'Fermer': 'Close',
        'Fermer le menu': 'Close menu',
        'Menu': 'Menu',
        // 53.3.0 (lot 11) : fenêtres Paramètres / Parcours / Codex / Musiques
        'Paramètres': 'Settings', 'Parcours': 'Paths', 'Codex': 'Codex', 'Musiques': 'Music', 'Fermer': 'Close',
        'Arbre des parcours': 'Path tree', 'Codex et chronologie': 'Codex and timeline', 'Musiques découvertes': 'Discovered music',
        'Audio': 'Audio', 'Musique': 'Music', 'Ambiances': 'Ambience', 'Effets': 'Effects', 'Lecture et accessibilité': 'Reading and accessibility',
        'Contraste renforcé': 'High contrast', 'Animations et effets visuels': 'Animations and visual effects', 'Vibrations légères': 'Light vibrations',
        'Passer automatiquement les simples « Continuer » après lecture': 'Automatically skip simple “Continue” choices after reading',
        'Récit présenté page par page (prend effet au prochain lancement)': 'Story shown page by page (applies next launch)',
        'Texte −': 'Text −', 'Texte +': 'Text +', 'Informations techniques': 'Technical information', 'Écouter': 'Play', 'Arrêter': 'Stop',
        'Morceau non découvert': 'Track not yet discovered', 'Classique': 'Classic', 'Nouvelle Partie+': 'New Game+', 'Scène non découverte': 'Undiscovered scene',
        'Scènes découvertes par acte': 'Discovered scenes by act', 'Objectif de l’acte en cours': 'Current act objective', 'Chargement…': 'Loading…', 'Chargement des scènes…': 'Loading scenes…',
        'Continuer': 'Continue', 'Continuer le texte': 'Continue the text', 'Continuer, page suivante': 'Continue, next page',
        'Afficher ou masquer les liens': 'Show or hide bonds',
        'Mode apparition du texte': 'Text fade-in mode',
        'Affichage instantané des passages lus': 'Instantly show already-read passages',
        'La sauvegarde automatique n’a pas pu être écrite (stockage plein ou navigation privée). Exporte ta partie depuis « Sauvegardes » pour ne rien perdre.':
          'Autosave could not be written (storage full or private browsing). Export your game from “Saves” to keep your progress.'
      }
    }
  };
  let lang = 'fr';
  try { lang = (CFG.langueInterface === 'en' || localStorage.getItem('ef_ui_lang') === 'en') ? 'en' : 'fr'; } catch (e) {}
  const t = k => (EF_STRINGS[lang] && EF_STRINGS[lang][k]) || EF_STRINGS.fr[k] || k;
  window.EF_I18N = { lang, t, strings: EF_STRINGS, translate: function(root){ try { translateTree(root); } catch (e) {} } };

  function translateTree(root){
    if (lang === 'fr' || !root) return;
    const map = EF_STRINGS.en.ui;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n; const todo = [];
    while ((n = walker.nextNode())) { const k = n.data.trim(); if (k && map[k]) todo.push([n, k]); }
    todo.forEach(([node, k]) => { node.data = node.data.replace(k, map[k]); });
    root.querySelectorAll && root.querySelectorAll('[title],[aria-label]').forEach(el => {
      ['title', 'aria-label'].forEach(a => { const v = el.getAttribute(a); if (v && map[v]) el.setAttribute(a, map[v]); });
    });
  }
  function applyLang(){
    try {

        document.querySelectorAll('.modal-close').forEach(translateTree);
        new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(x => { if (x.nodeType === 1 && x.getAttribute('role') === 'alert') translateTree(x); }))).observe(document.body, { childList: true });
      }

  }

  /* ---------- Lot 10 : accessibilité ---------- */
  let live = null;

  function announce(data){

    if (!btns.length) return;
    e.preventDefault();
    const i = btns.indexOf(document.activeElement);
    const next = i < 0 ? (e.key === 'ArrowDown' ? 0 : btns.length - 1) : (i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns[next].focus();

  const PAUSE_MS = 8 * 3600 * 1000;
  let resumeGap = 0;
  function markPlay(){ try { localStorage.setItem('ef_last_play', String(Date.now())); } catch (e) {} }
